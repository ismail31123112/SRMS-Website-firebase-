name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main # তোমার ব্রাঞ্চের নাম master হলে এখানে master লিখবে

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SRMS_WEBSITE_MANAGEMENT }}
          projectId: srms-website-management
          channelId: live
